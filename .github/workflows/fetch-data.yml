name: Fetch stock data

# Daily candles after NSE (10:00 UTC) and US (20:00/21:00 UTC) markets close
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: DataFetcher/requirements.txt
      - name: Check configuration
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          if [ -z "$MONGO_URL" ]; then
            echo "::warning::Add the MONGO_URL repository secret to enable the daily data fetch."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - name: Fetch and upsert candles
        if: env.SKIP != '1'
        working-directory: DataFetcher/src
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
        run: |
          pip install -r ../requirements.txt
          python main.py
